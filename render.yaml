# Expose the CatDex Hono API (analyze-cat + health).
# Deploy: connect the GitHub repo on https://dashboard.render.com → New → Blueprint
services:
  - type: web
    name: catdex-api
    runtime: docker
    # Repo root so Docker can COPY shared/ (Vision prompt single source of truth).
    rootDir: .
    dockerfilePath: ./server/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8787"
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_STATS_SECRET
        sync: false
      # Beta: allow Vision analyze even if JWT verify is misconfigured on Render.
      # Set to "0" once SUPABASE_JWT_SECRET (or Auth API keys) is confirmed.
      - key: ALLOW_UNAUTH_ANALYZE
        value: "1"
      - key: API_SECRET
        generateValue: true
