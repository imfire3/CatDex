# Expose the CatDex Hono API (analyze-cat + health).
# Deploy: connect the GitHub repo on https://dashboard.render.com → New → Blueprint
services:
  - type: web
    name: catdex-api
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8787"
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: API_SECRET
        generateValue: true
