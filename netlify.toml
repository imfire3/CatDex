# Configuration Netlify pour CatDex Web
# Documentation : https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Commande pour builder l'app web
  command = "npx expo export --platform web"
  
  # Répertoire à déployer
  publish = "dist"
  
  # Variables d'environnement pour le build
  # Ces variables DOIVENT être configurées dans le dashboard Netlify :
  # Site settings → Environment variables
  
[build.environment]
  # Version de Node.js
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Bundle shared Vision prompt/schema + Netlify helpers into functions.
  included_files = ["shared/**", "netlify/lib/**"]

# Vision API on same origin (avoids broken Render JWT gate during beta)
[[redirects]]
  from = "/analyze-cat"
  to = "/.netlify/functions/analyze-cat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

# Secret-gated ops dashboard (ADMIN_STATS_SECRET via ?key=)
[[redirects]]
  from = "/admin"
  to = "/.netlify/functions/admin"
  status = 200
  force = true

# Redirections pour SPA (Single Page Application)
# Toutes les routes doivent pointer vers index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    # Sécurité
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache différencié pour index.html (pas de cache)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Cache pour les assets statiques
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Variables d'environnement requises (à configurer dans le dashboard) :
#
# EXPO_PUBLIC_SUPABASE_URL=https://votre-projet.supabase.co
# EXPO_PUBLIC_SUPABASE_ANON_KEY=votre-anon-key
# EXPO_PUBLIC_API_URL=https://votre-api.onrender.com
# EXPO_PUBLIC_AUTH_GOOGLE=true (optionnel)
# EXPO_PUBLIC_AUTH_APPLE=true (optionnel)
# OPENAI_API_KEY=… (functions analyze-cat)
# SUPABASE_URL=… (functions admin + vision_runs)
# SUPABASE_SECRET_KEY=sb_secret_… (preferred) or SUPABASE_SERVICE_ROLE_KEY
# ADMIN_STATS_SECRET=… (GET /admin?key=…)
